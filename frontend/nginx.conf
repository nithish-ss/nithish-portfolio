server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=10s;   # Docker's internal DNS

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # API: same origin as the site, so no CORS needed
  location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Streamlit ML demo, served under /streamlit/ (needs websocket upgrade)
  location /streamlit/ {
    set $mldemo http://ml-demo:8501;
    proxy_pass $mldemo;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Hashed assets and fonts: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback so /projects/slug works on refresh.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
